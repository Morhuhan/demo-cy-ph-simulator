# Конфигурация стенда КФТ-01.
#
# Пороги здесь — стартовые. Их калибровка на реальных записях запланирована
# на этап интеграции: данные даёт CV-команда, значения выставляет сценарная
# часть, не трогая код.

sop_path: configs/sop/kft-01.yaml

# ---------------------------------------------------------------------------
# Сглаживание потока наблюдений.
#
# CV шлёт ~15 сообщений в секунду на переменную, а шаг выполняется один раз.
# Без окна подтверждения и гистерезиса труба на полпути металась бы между
# соседними состояниями, а движок сыпал бы вердиктами.
# ---------------------------------------------------------------------------
smoothing:
  defaults:
    confirm_window_sec: 0.9
    min_confidence: 0.55
    min_agreement: 0.7
    min_hold_sec: 0.4
    stale_after_sec: 4.0
    unclear_after_sec: 2.5
    unclear_report_sec: 3.0
    min_observations: 5

  variables:
    # Труба — самая шумная переменная: over_hatch и seated различаются
    # несколькими сантиметрами высоты. Окно чуть длиннее, а главное — выше
    # требование к согласию: на дребезге ни одно значение не наберёт 0.85.
    pipe_position:
      confirm_window_sec: 1.1
      min_confidence: 0.6
      min_agreement: 0.85
      min_hold_sec: 0.5
      stale_after_sec: 4.0
      # Опускание трубы лебёдкой длится секунды, и всё это время положение
      # честно неопределённо. Порог поднят выше самого долгого физического
      # перехода плюс окно подтверждения — иначе нормальная работа оператора
      # выглядела бы как отказ распознавания.
      unclear_after_sec: 4.0
      unclear_report_sec: 3.0
      min_observations: 8

    # Лампа — самый надёжный признак, яркий источник света. Здесь можно быстрее.
    grounding_lamp:
      confirm_window_sec: 0.6
      min_confidence: 0.6
      min_agreement: 0.75
      min_hold_sec: 0.3
      stale_after_sec: 4.0
      unclear_after_sec: 2.5
      unclear_report_sec: 3.0
      min_observations: 4

engine:
  default_mode: training
  unclear_cooldown_sec: 6.0
  low_confidence_grace_sec: 1.5
  stream_lost_after_sec: 4.0
  announce_unclear_in_testing: false

voice:
  # auto: Silero, если установлен torch (pip install -e ".[voice]"),
  # иначе синтез средствами браузера инструктора.
  engine: auto
  silero:
    model_id: v4_ru
    speaker: eugene
    sample_rate: 24000
  stt:
    engine: auto
    model_size: small
    language: ru
  cache_dir: data/tts-cache
  warmup: true
  queue_max: 8

storage:
  url: sqlite+aiosqlite:///data/kft01.sqlite3
  # Сырой поток наблюдений по умолчанию не пишем — 15 сообщений/с на переменную
  # растят базу быстрее, чем это оправдано. Включать на время сбора датасета.
  store_observations: false
  retention:
    sessions_days: 90
    observations_days: 7
    video_days: 30

# Заготовки под 152-ФЗ (п. 2.3 вопросника). Флаги требований, не реализация:
# размытие лиц технически исполняет CV-модуль.
privacy:
  consent_required: true
  blur_faces_required: true
  store_raw_video: true
  video_ring_buffer_sec: 300

# Норматив 2 секунды из п. 6.2 ТЗ, разделённый по звеньям заранее,
# чтобы на приёмке не спорить, из-за чьей части не уложились.
#
# Окно сглаживания — отдельной строкой и самая крупная статья расхода. Это
# плата за то, что система не дёргается на дребезге: раньше окна подтвердить
# состояние физически нельзя. Ужимать имеет смысл только вместе с ростом
# качества распознавания, иначе посыплются ложные срабатывания.
latency_budget:
  cv_ms: 500
  smoothing_ms: 1100
  engine_ms: 100
  voice_ms: 300
  total_ms: 2000

emulator:
  enabled: true
  runs_dir: configs/runs
  default_run: null
  rate_hz: 15
  camera_id: chest-01
  post_id: С-4

# ---------------------------------------------------------------------------
# Разбор занятия связным текстом.
#
# Формируется после занятия по сохранённым вердиктам. Модель пересказывает
# уже вынесенные оценки и своих не выносит — решения остаются за движком,
# иначе приёмочная метрика точности потеряла бы смысл.
#
# engine: auto — модель, если задан ключ, иначе шаблон. Шаблон работает
# без сети и ключей, поэтому в изолированном контуре разбор будет всегда.
# Ключ в конфигурации не хранится: здесь только имя переменной окружения.
# ---------------------------------------------------------------------------
debrief:
  engine: auto
  base_url: https://gptunnel.ru/v1
  model: gpt-5.6-sol
  api_key_env: AI_API_KEY
  use_bearer: false
  timeout_sec: 60
  max_tokens: 700
