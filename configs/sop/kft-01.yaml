# Сценарий КФТ-01 — верхний налив ЛВЖ в вагон-цистерну.
#
# Это машиночитаемая форма регламента. Код про шаги ничего не знает: чтобы
# изменить порядок, пороги, тайм-ауты или формулировки, правится только этот
# файл (п. 1.3 вопросника Заказчика).
#
# Секция observables — одновременно техническое задание для CV-команды. Из неё
# генерируется строгая JSON Schema: python -m tools.gen_schemas

id: kft-01
scenario_code: КФТ-01
title: Верхний налив ЛВЖ в вагон-цистерну
description: >-
  Отработка последовательности действий оператора на устройстве верхнего налива.
  Семь шагов, из них три — с явными последствиями ошибки по регламенту:
  заземление, механизм прижатия, опускание трубы до дна.
source_document: Алгоритм работы на устройстве верхнего налива (регламент Заказчика)

# ---------------------------------------------------------------------------
# Что должен распознавать модуль компьютерного зрения.
# Четыре переменные покрывают все семь шагов: шаги 3, 4 и 6 — это одна
# переменная pipe_position в трёх разных значениях.
# ---------------------------------------------------------------------------
observables:

  grounding_lamp:
    title: Лампа прибора заземления
    description: >-
      Сигнальная лампа на приборе заземления. Самый надёжный визуальный признак
      во всём сценарии — яркий источник света, различим при любом освещении.
    initial: "off"
    values:
      "off":
        title: не горит
      green:
        title: горит зелёным

  hatch_cover:
    title: Крышка люка-лаза
    description: Крышка люка-лаза вагон-цистерны в закрытом или откинутом положении.
    initial: closed
    values:
      closed:
        title: закрыта
      open:
        title: открыта

  pipe_position:
    title: Труба телескопическая наливная
    description: >-
      Положение наливной трубы. Внимание CV-команде: over_hatch и seated
      визуально близки — различие в нескольких сантиметрах высоты. Это самое
      трудное место сценария, здесь ожидаются низкая уверенность и дребезг.
    initial: stowed
    values:
      stowed:
        title: в исходном положении
      over_hatch:
        title: над горловиной
      seated:
        title: опущена до упора крышки в горловину
      bottom:
        title: опущена до дна цистерны

  clamp_weight:
    title: Груз механизма прижатия
    description: Положение груза механизма прижатия крышки к горловине цистерны.
    initial: released
    values:
      released:
        title: отжат
      pressed:
        title: прижат

# ---------------------------------------------------------------------------
# Семь шагов регламента.
#
# requires — не «рекомендуемый порядок», а предусловие. Нарушение requires у
# шага, чьё предусловие помечено critical, останавливает сценарий.
# ---------------------------------------------------------------------------
steps:

  - id: grounding
    title: Подключить устройство заземления и убедиться в замыкании цепи
    critical: true
    timeout_sec: 120
    min_confidence: 0.7
    expect:
      - variable: grounding_lamp
        equals: green
    requires: []
    consequence: >-
      Без заземления возможно появление искры вследствие статического
      электричества и дальнейшее возгорание во время открытия люка и процессов
      слива-налива.
    phrases:
      instruction: Подключите устройство заземления и убедитесь, что загорелась зелёная лампа.
      success: Заземление подключено, цепь замкнута. Можно продолжать.
      hint: >-
        Заземляющий зажим крепится к корпусу цистерны до всех остальных операций.
        Признак замкнутой цепи — зелёный сигнал на приборе заземления.
      timeout: Заземление до сих пор не подключено. Начните с него, без этого работать нельзя.

  - id: hatch
    title: Открыть крышку люка-лаза
    timeout_sec: 90
    expect:
      - variable: hatch_cover
        equals: open
    requires:
      - grounding
    phrases:
      instruction: Откройте крышку люка-лаза.
      success: Крышка люка-лаза открыта.
      violation: >-
        Стоп. Вы открываете люк, не подключив заземление. Статическое
        электричество может дать искру и вызвать возгорание. Закройте крышку
        и подключите устройство заземления.
      hint: Крышка люка-лаза откидывается вверх до фиксации.
      timeout: Крышка люка-лаза всё ещё закрыта.

  - id: pipe_over
    title: Подвести и установить наливную трубу над горловиной цистерны
    timeout_sec: 120
    expect:
      - variable: pipe_position
        equals: over_hatch
    requires:
      - hatch
    phrases:
      instruction: Подведите телескопическую наливную трубу и установите её над горловиной цистерны.
      success: Труба установлена над горловиной.
      violation: Труба подводится только после того, как открыта крышка люка-лаза.
      hint: Труба подводится поворотом стрелы до совмещения с осью горловины.
      timeout: Труба ещё не установлена над горловиной.

  - id: pipe_seated
    title: Опустить трубу до упора крышки в горловину цистерны
    timeout_sec: 90
    expect:
      - variable: pipe_position
        equals: seated
    requires:
      - pipe_over
    phrases:
      instruction: Опустите наливную трубу до упора крышки устройства в горловину цистерны.
      success: Труба опущена до упора, крышка села в горловину.
      violation: Опускать трубу можно только после того, как она установлена над горловиной.
      hint: Опускайте до момента, когда крышка устройства ляжет на горловину цистерны.
      timeout: Труба не доведена до упора в горловину.

  - id: clamp
    title: Установить груз механизма прижатия в положение «прижато»
    critical: true
    timeout_sec: 90
    min_confidence: 0.7
    expect:
      - variable: clamp_weight
        equals: pressed
    requires:
      - pipe_seated
    consequence: >-
      Без прижатия во время налива возможно подпрыгивание устройства в горловине
      с созданием загазованности, вплоть до выброса устройства из вагона
      и розлива вокруг цистерны и на площадке обслуживания.
    phrases:
      instruction: Установите груз механизма прижатия в положение «прижато» и прижмите крышку к горловине.
      success: Груз прижат, устройство закреплено в горловине цистерны.
      violation: Прижимать крышку можно только после того, как труба опущена до упора в горловину.
      hint: >-
        Груз механизма прижатия переводится в положение «прижато» до отказа.
        Устройство должно быть плотно закреплено в горловине.
      timeout: Груз механизма прижатия до сих пор не переведён в положение «прижато».

  - id: pipe_bottom
    title: Рукояткой лебёдки опустить наливную трубу до дна цистерны
    critical: true
    timeout_sec: 240
    min_confidence: 0.7
    expect:
      - variable: pipe_position
        equals: bottom
    requires:
      - clamp
    consequence: >-
      При наливе без опущенной до дна трубы происходит падение жидкости
      с образованием статического электричества, возможен проскок искры,
      возгорание или взрыв в цистерне. При сливе будет откачано только 50%,
      после чего насосы остановятся по блокировке.
    phrases:
      instruction: Рукояткой лебёдки опустите телескопическую трубу до дна цистерны.
      success: Труба опущена до дна цистерны.
      violation: Опускать трубу лебёдкой можно только после того, как груз механизма прижатия прижат.
      hint: >-
        Вращайте рукоятку лебёдки до полного выхода телескопической секции.
        Труба должна дойти до дна цистерны.
      timeout: Труба ещё не опущена до дна. Продолжайте вращать рукоятку лебёдки.

  - id: report
    title: Сообщить в операторную о готовности к наливу
    timeout_sec: 120
    expect:
      - voice_intent: ready_report
    requires:
      - clamp
      - pipe_bottom
    phrases:
      instruction: Сообщите в операторную о готовности к наливу.
      success: Доклад принят. Последовательность выполнена полностью.
      violation: >-
        Стоп. Докладывать о готовности рано. Пуск насоса при неприжатом
        механизме или неопущенной трубе ведёт к аварии.
      hint: Доложите голосом — например «операторная, к наливу готов».
      timeout: Доклад о готовности в операторную не поступил.

# ---------------------------------------------------------------------------
# Инварианты — условия, которые должны держаться до конца сценария.
# Без них движок принял бы «лампа заземления погасла на пятом шаге» за
# обычную смену состояния.
# ---------------------------------------------------------------------------
invariants:
  - id: grounding_holds
    after_step: grounding
    variable: grounding_lamp
    must_equal: green
    severity: critical
    message: >-
      Внимание, пропал сигнал заземления. Остановите работу и восстановите
      подключение заземляющего устройства.

  - id: clamp_holds
    after_step: clamp
    variable: clamp_weight
    must_equal: pressed
    severity: critical
    message: >-
      Внимание, механизм прижатия отжат. Устройство может быть выброшено
      из горловины во время налива. Верните груз в положение «прижато».

phrases:
  welcome: Тренажёр верхнего налива. Приступайте к выполнению последовательности.
  finished: Сценарий завершён. Формирую отчёт.
  aborted: Сценарий остановлен.
  unclear: Не удалось разобрать действие. Повторите или войдите в кадр.
  stream_lost: Потерян видеосигнал. Оценка действий приостановлена.
  help_fallback: Выполняйте текущий шаг последовательности. Для повтора инструкции скажите «повтори».
