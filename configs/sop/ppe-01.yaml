# Сценарий СИЗ-01 — проверка средств индивидуальной защиты перед допуском к работе.
#
# Демонстрационный сценарий, согласован на встрече 07.09.2026. По составу СИЗ
# ограничен защитной каской (решение от 17.09): CV-модуль распознаёт только её.
# Добавление перчаток и прочих элементов — это новая переменная в observables
# и новый шаг здесь, без изменений в коде.
#
# Имена переменной и значений выбраны так, чтобы совпадать с контрактом
# CV-модуля: object="helmet", state="on"|"off". Маппинг в cv_ingress получается
# тождественным — см. docs/integration-cv.md.

id: ppe-01
scenario_code: СИЗ-01
title: Проверка средств индивидуальной защиты перед допуском к работе
description: >-
  Перед началом работы сотрудник направляет нагрудную камеру на себя, система
  проверяет наличие защитной каски и допускает к работе либо фиксирует
  нарушение с указанием последствий. После допуска каска должна оставаться
  надетой до конца занятия.
source_document: Требования к применению СИЗ при работе на производственной площадке

# ---------------------------------------------------------------------------
# Что должен распознавать модуль компьютерного зрения.
#
# Одна переменная на весь сценарий. Состояние относится к конкретному человеку
# в кадре: CV присылает subject_id, выбор проверяемого сотрудника выполняет
# cv_ingress, сюда приходит состояние уже выбранного субъекта.
# ---------------------------------------------------------------------------
observables:

  helmet:
    title: Защитная каска
    description: >-
      Защитная каска на голове сотрудника. Проверяется именно надетая каска:
      каска в руках, на сгибе локтя или висящая на поясе засчитываться не
      должна. Распознаётся по области головы человека в кадре.
    initial: "off"
    values:
      "off":
        title: не надета
      "on":
        title: надета

# ---------------------------------------------------------------------------
# Два шага: проверка и допуск.
#
# Шаг проверки критический и с коротким сторожевым таймером. Если за отведённое
# время каска не предъявлена, система не ждёт молча, а объявляет нарушение
# и его последствия — это и есть требование «короткого вывода» из саммари 07.09.
# ---------------------------------------------------------------------------
steps:

  - id: helmet_check
    title: Предъявить надетую защитную каску
    critical: true
    # Сколько сотруднику даётся на предъявление каски. Величина регламентная,
    # а не техническая: восьми секунд достаточно, чтобы встать в кадр.
    timeout_sec: 8
    min_confidence: 0.7
    # Проверяется состояние, а не действие: пришёл уже в каске — проверка
    # пройдена сразу, снимать и надевать её заново ради системы не нужно.
    accept_current_state: true
    expect:
      - variable: helmet
        equals: "on"
    requires: []
    consequence: >-
      Работа без защитной каски запрещена. При падении предметов с высоты
      или ударе о выступающие конструкции это ведёт к тяжёлой
      черепно-мозговой травме.
    phrases:
      # Приветствие уже назвало занятие, поэтому команда сразу о действии:
      # два подряд «проверка средств защиты» звучат как заевшая запись.
      instruction: >-
        Направьте камеру на себя и убедитесь, что защитная каска надета.
      success: Каска надета. Проверка средств защиты пройдена, допуск к работе разрешён.
      hint: >-
        Каска должна быть надета на голову и застёгнута. Держите лицо и голову
        в кадре на расстоянии вытянутой руки.
      timeout: >-
        Защитная каска не обнаружена. Допуск к работе запрещён. Работа без каски
        ведёт к тяжёлой травме головы при падении предметов с высоты. Наденьте
        каску и повторите проверку.

  - id: ready_report
    title: Доложить о готовности к работе
    timeout_sec: 60
    expect:
      - voice_intent: ready_report
    requires:
      - helmet_check
    phrases:
      instruction: Наденьте камеру и доложите о готовности к работе.
      success: Доклад принят. Проверка завершена, приступайте к работе.
      violation: >-
        Стоп. Докладывать о готовности нельзя: проверка средств защиты
        не пройдена.
      hint: Доложите голосом — например «к работе готов».
      timeout: Доклад о готовности к работе не поступил.

# ---------------------------------------------------------------------------
# Каска, предъявленная на проверке, должна остаться надетой.
#
# Без инварианта система проверила бы СИЗ на входе и забыла о них. Снятая
# посреди работы каска — это то же нарушение, что и непройденная проверка,
# и реагировать на неё надо так же.
# ---------------------------------------------------------------------------
invariants:
  - id: helmet_holds
    after_step: helmet_check
    variable: helmet
    must_equal: "on"
    severity: critical
    message: >-
      Внимание, защитная каска снята. Работа без каски запрещена — это риск
      тяжёлой травмы головы. Немедленно наденьте каску.

phrases:
  # Коротко: после приветствия сразу звучит команда, и обеим репликам надо
  # уложиться в отведённое шагу время — иначе предупреждение о нарушении
  # перебьёт команду на полуслове.
  welcome: Занятие начато. Проверка средств индивидуальной защиты.
  finished: Проверка завершена. Формирую отчёт.
  aborted: Проверка остановлена.
  unclear: Не удалось разобрать. Войдите в кадр и держите голову в поле зрения камеры.
  stream_lost: Потерян видеосигнал. Проверка приостановлена.
  help_fallback: Направьте камеру на себя так, чтобы голова полностью попадала в кадр.
