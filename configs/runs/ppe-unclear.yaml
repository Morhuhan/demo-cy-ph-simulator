# Система не разобрала: сотрудник слишком далеко и против света.
#
# Ключевое отличие от нарушения: «не вижу» — это не «каски нет». Система
# обязана сказать об этом честно и не засчитывать проверку ни в одну
# из сторон, пока не разберёт кадр.

id: ppe-unclear
title: Распознавание неуверенное
scenario: ppe-01
description: >-
  Сотрудник в кадре далеко и против света, уверенность распознавания низкая.
  Система сообщает, что не разобрала, и просит войти в кадр. После того как
  сотрудник подходит ближе, проверка проходит штатно.
duration_sec: 22

noise:
  confidence_mean: 0.90
  confidence_jitter: 0.05
  flicker_prob: 0.02
  unclear_prob: 0.01

timeline:
  - at: 1
    note: Сотрудник далеко от камеры, сильная засветка сзади
    noise:
      confidence_mean: 0.30
      confidence_jitter: 0.08
      flicker_prob: 0.10
      unclear_prob: 0.85

  - at: 4
    note: Сотрудник подошёл ближе, условия съёмки нормальные
    noise:
      confidence_mean: 0.90
      confidence_jitter: 0.05
      flicker_prob: 0.02
      unclear_prob: 0.01

  - at: 5
    note: Каска надета, кадр разобран
    set:
      helmet: "on"
    transition_sec: 1.0

  - at: 14
    note: Доклад о готовности к работе
    voice: ready_report

# UNCLEAR в ожидаемое не входит: он зависит от профиля шума и стабильным
# приёмочным критерием быть не может. Критерий здесь в другом — несмотря
# на плохие условия съёмки, система приходит к верному выводу и не выдумывает
# нарушений оператору.
expected:
  - step: helmet_check
    kind: MATCH
    reason: step_completed
  - step: ready_report
    kind: MATCH
    reason: step_completed
