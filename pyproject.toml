[project]
name = "kft-01"
version = "0.1.0"
description = "Киберфизический тренажёр КФТ-01 — сценарная, голосовая и интеграционная часть"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "redis>=5.2",
    "httpx>=0.28",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Реальный TTS/STT. Тянет torch (~2 ГБ), поэтому вынесен в extras:
# без него голос уходит в браузерный fallback, см. docs/operations.md
voice = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "faster-whisper>=1.0",
    "soundfile>=0.12",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "services*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
